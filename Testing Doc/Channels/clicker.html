<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wii Menu</title>
  <link rel="stylesheet" href="clicker.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
  </head>
  <body>
    <section>
        <div class="main">
            <div class="left">
                <div>
                    <a href="../index.html">
                        <button class="homebtn">
                            <h2>Home</h1>
                        </button>
                    </a>
                </div>
                <div class="coin-count">
                    <h3>Coins:  <span class="coin-cost">0</span> <img class="coin-icon" src="../Images/Coin.png"></h3>
                </div>
                <div class="clicker-imgBG">
                    <img draggable="false" src="../Images/Clicker/Clicker.png" class="clicker-img" onclick="incrementCoins()">
                </div>
                <div class="statistics">
                    <div class="text">
                        <p>Coins Per Click: <br> <span id ="cpcText">1</span></p>
                        <p>Coins Per second: <br> <span id ="cpsText">0</span></p>
                    </div>
                </div>
            </div>
            <div class="right">
                <div class="upgradeBox" id="UpgradeBox"></div>
            </div>
    </section>
    <script src="clicker.js"></script>
  </body>
  </html>
