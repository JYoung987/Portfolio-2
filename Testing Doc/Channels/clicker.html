<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wii Menu</title>
  <link rel="stylesheet" href="clicker.css">
  </head>
  <body>
    <section>
        <div class="main">
            <div class="left">
                <h3>Clicker</h3>
                <h3>Coins:<span class="coin-cost">0</span></h3>
                <img draggable="false" src="../Images/Clicker.png" class="clicker-img" onclick="incrementCoins()">
            </div>
            <div class="right">
                <div class="upgrades">
                    <div class="left-section">
                        <img src="../Images/PointerIcon.png" alt="" class="pointer-icon">
                    </div>
                    <div class="center-section">
                        <h4>Clicker</h4>
                        <div>
                            <p>Cost: <span class="cost">10</span></p>
                            <img src="../Images/coin.png" alt="" class="coin-icon">
                        </div>
                    </div>
                    <div class="right-section"></div>
                </div>
            </div>
        </div>
    </section>
    <script src="clicker.js"></script>
  </body>
  </html>
