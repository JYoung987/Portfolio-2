<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wii Menu</title>
  <link rel="stylesheet" href="clicker.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
  </head>
  <body>
    <section>
        <div class="main">
            <div class="left">
                <h3>Doughnut Clicker</h3>
                <h3>Coins:<span class="coin-cost">0</span></h3>
                <div class="clicker-imgBG">
                    <img draggable="false" src="../Images/Clicker/Clicker.png" class="clicker-img" onclick="incrementCoins()">
                </div>
            </div>
            <div class="right">
                <div class="upgradeBox" id="UpgradeBox"></div>
            </div>
            <div class="statistics">
                <div class="text">
                    <p>Coins Per Click: <span id="cpcText">1</span></p>
                    <p>Coins Per second: <span id="cpsText">0</span></p>
                </div>
            </div>
    </section>
    <script src="clicker.js"></script>
  </body>
  </html>
